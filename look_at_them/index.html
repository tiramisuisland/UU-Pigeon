<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real Popup Sequence</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070808;
      --panel: #121618;
      --line: rgba(170, 220, 205, .26);
      --text: #eef2ee;
      --muted: #8d9893;
      --signal: #86f8b8;
      --amber: #f0bb65;
      --alert: #ff665f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        linear-gradient(rgba(255, 255, 255, .025) 50%, rgba(0, 0, 0, .14) 50%),
        radial-gradient(circle at 22% 18%, rgba(134, 248, 184, .12), transparent 28%),
        radial-gradient(circle at 80% 76%, rgba(240, 187, 101, .1), transparent 30%),
        #070808;
      background-size: 100% 4px, auto, auto, auto;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .panel {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(18, 22, 24, .82);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .42);
      padding: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--signal);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 18px var(--signal);
      animation: blink 1.1s steps(2, end) infinite;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 6vw, 58px);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(134, 248, 184, .54);
      border-radius: 6px;
      background: rgba(134, 248, 184, .12);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      cursor: pointer;
    }

    button:hover {
      background: rgba(134, 248, 184, .18);
    }

    .status {
      min-height: 42px;
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(170, 220, 205, .16);
      border-radius: 6px;
      color: var(--amber);
      font-size: 13px;
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
    }

    .hidden-probe {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes blink {
      50% {
        opacity: .25;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><span class="pulse"></span><span>REAL POPUP SEQUENCE</span></div>
    <h1>C1 先彈出</h1>
    <p>按下啟動後，瀏覽器會先開出 C1 的獨立 popup 視窗。5 秒後，其他影片會用新的瀏覽器 popup 視窗一次炸出。每個視窗都可以用系統視窗邊框自由拉伸。</p>
    <button type="button" id="launch">LAUNCH POPUPS</button>
    <div class="status" id="status">等待啟動。若瀏覽器阻擋 popup，請允許此網站彈出視窗後再按一次。</div>
  </main>

  <script>
    const clips = [
      "1.mp4",
      "3.mp4",
      "4.mp4",
      "5.mp4",
      "6.mp4",
      "7.mp4",
      "8.mp4",
      "9.mp4",
      "10.mp4",
      "11.mp4",
      "12.mp4",
      "13.mp4"
    ];

    const launch = document.querySelector("#launch");
    const statusText = document.querySelector("#status");
    const searchParams = new URLSearchParams(window.location.search);
    const shouldAutostart = searchParams.get("autostart") === "1";
    const metadataCache = new Map();
    let popupWindows = [];
    let monitorTimer = null;
    let closingAll = false;
    let launching = false;
    let c1Audio = null;

    function setStatus(text) {
      statusText.textContent = text;
    }

    function playC1Audio() {
      if (c1Audio) return;

      c1Audio = new Audio("C1.mp4");
      c1Audio.loop = false;
      c1Audio.preload = "auto";
      c1Audio.volume = 1;
      c1Audio.muted = false;
      c1Audio.play().catch(() => {
        c1Audio = null;
      });
    }

    function stopC1Audio() {
      if (!c1Audio) return;

      c1Audio.pause();
      c1Audio.removeAttribute("src");
      c1Audio.load();
      c1Audio = null;
    }

    window.playC1Audio = playC1Audio;
    window.stopC1Audio = stopC1Audio;

    function closeAllPopups() {
      if (closingAll) return;
      closingAll = true;

      window.clearInterval(monitorTimer);
      monitorTimer = null;
      stopC1Audio();

      popupWindows.forEach((popup) => {
        try {
          if (popup && !popup.closed) popup.close();
        } catch (error) {}
      });

      popupWindows = [];
      launch.disabled = false;
      setStatus("其中一個 popup 已關閉，其他 popup 已一起關閉。");

      window.setTimeout(() => {
        closingAll = false;
      }, 500);
    }

    function monitorPopups() {
      window.clearInterval(monitorTimer);
      monitorTimer = window.setInterval(() => {
        if (closingAll || popupWindows.length === 0) return;

        const hasClosedWindow = popupWindows.some((popup) => {
          try {
            return !popup || popup.closed;
          } catch (error) {
            return true;
          }
        });

        if (hasClosedWindow) closeAllPopups();
      }, 300);
    }

    function waitForMetadata(src) {
      if (metadataCache.has(src)) return Promise.resolve(metadataCache.get(src));

      return new Promise((resolve) => {
        const probe = document.createElement("video");
        probe.muted = true;
        probe.preload = "metadata";
        probe.playsInline = true;
        probe.src = src;
        probe.onloadedmetadata = () => {
          const size = {
            width: probe.videoWidth || 640,
            height: probe.videoHeight || 360
          };
          metadataCache.set(src, size);
          resolve(size);
        };
        probe.onerror = () => {
          const size = { width: 640, height: 360 };
          metadataCache.set(src, size);
          resolve(size);
        };
      });
    }

    function cachedSize(src) {
      return metadataCache.get(src) || { width: 640, height: 360 };
    }

    function fitToScreen(size, maxRatio = .82) {
      const maxWidth = Math.floor(window.screen.availWidth * maxRatio);
      const maxHeight = Math.floor(window.screen.availHeight * maxRatio);
      const scale = Math.min(1, maxWidth / size.width, maxHeight / size.height);

      return {
        width: Math.max(220, Math.round(size.width * scale)),
        height: Math.max(160, Math.round(size.height * scale))
      };
    }

    function fitInsideCell(size, cellWidth, cellHeight) {
      const scale = Math.min(cellWidth / size.width, cellHeight / size.height);

      return {
        width: Math.max(150, Math.floor(size.width * scale)),
        height: Math.max(105, Math.floor(size.height * scale))
      };
    }

    function topRightRect(size, margin = 18) {
      return {
        width: size.width,
        height: size.height,
        left: Math.max(0, window.screen.availWidth - size.width - margin),
        top: margin
      };
    }

    function popupHtml(src, label, sourceSize, delay, rect, shouldLoop) {
      const useOpenerAudio = label === "C1";
      return `<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>${label}</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #86f8b8;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::after {
      content: "${label} / ${sourceSize.width}x${sourceSize.height}";
      position: fixed;
      left: 8px;
      top: 8px;
      padding: 5px 7px;
      background: rgba(0, 0, 0, .58);
      border: 1px solid rgba(134, 248, 184, .38);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      z-index: 2;
    }

    video {
      width: 100vw;
      height: 100vh;
      display: none;
      object-fit: fill;
      background: #000;
    }

    .armed {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #f0bb65;
      background: #050606;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

  </style>
</head>
<body>
  <div class="armed" id="armed">${delay ? "ARMED / +" + Math.round(delay / 1000) + "S" : "LIVE"}</div>
  <video id="video" src="${src}" autoplay ${useOpenerAudio ? "muted" : ""} ${shouldLoop ? "loop" : ""} playsinline></video>
  <script>
    const video = document.querySelector("#video");
    const armed = document.querySelector("#armed");
    const useOpenerAudio = ${useOpenerAudio ? "true" : "false"};
    let activated = false;

    function fitWindowToVideo() {
      const naturalWidth = video.videoWidth || ${sourceSize.width};
      const naturalHeight = video.videoHeight || ${sourceSize.height};
      if (!naturalWidth || !naturalHeight) return;
      const scale = Math.min(
        1,
        (window.screen.availWidth * 0.82) / naturalWidth,
        (window.screen.availHeight * 0.82) / naturalHeight
      );
      const width = Math.max(1, Math.round(naturalWidth * scale));
      const height = Math.max(1, Math.round(naturalHeight * scale));
      const left = Math.round(Math.max(0, Math.min(${rect.left}, window.screen.availWidth - width)));
      const top = Math.round(Math.max(0, Math.min(${rect.top}, window.screen.availHeight - height)));

      try {
        window.moveTo(left, top);
        window.resizeTo(width, height);
      } catch (error) {}
    }

    async function playWithSound() {
      video.muted = useOpenerAudio;
      video.volume = useOpenerAudio ? 0 : 1;
      try {
        await video.play();
      } catch (error) {
        video.muted = true;
        video.volume = 0;
        await video.play().catch(() => {});
      }
    }

    function activate() {
      if (activated) return;
      activated = true;

      fitWindowToVideo();

      armed.style.display = "none";
      video.style.display = "block";
      video.muted = useOpenerAudio;
      video.currentTime = 0;
      if (useOpenerAudio) {
        try {
          window.opener?.playC1Audio?.();
        } catch (error) {}
      }
      playWithSound();
    }

    window.activatePopup = activate;
    video.addEventListener("loadedmetadata", fitWindowToVideo, { once: true });
    window.addEventListener("focus", playWithSound);
    window.addEventListener("pointerdown", playWithSound);

    window.addEventListener("beforeunload", () => {
      try {
        if (useOpenerAudio) {
          window.opener?.stopC1Audio?.();
        }
        window.opener.postMessage({ type: "popup-window-closed" }, "*");
      } catch (error) {}
    });

    window.setTimeout(activate, ${delay});
  <\/script>
</body>
</html>`;
    }

    function openVideoPopup(src, label, sourceSize, rect, delay = 0, startTiny = false, shouldLoop = true) {
      const initialWidth = startTiny ? 220 : rect.width;
      const initialHeight = startTiny ? 140 : rect.height;
      const hiddenRect = topRightRect({ width: initialWidth, height: initialHeight }, 26);
      const initialLeft = startTiny ? hiddenRect.left : rect.left;
      const initialTop = startTiny ? hiddenRect.top : rect.top;
      const features = [
        "popup=yes",
        "resizable=yes",
        "scrollbars=no",
        `width=${initialWidth}`,
        `height=${initialHeight}`,
        `left=${initialLeft}`,
        `top=${initialTop}`
      ].join(",");

      const win = window.open("", `${label}-${Date.now()}-${Math.random()}`, features);
      if (!win) return null;

      win.document.open();
      win.document.write(popupHtml(src, label, sourceSize, delay, rect, shouldLoop));
      win.document.close();
      popupWindows.push(win);
      if (delay === 0 && win.activatePopup) {
        win.activatePopup();
      }
      win.focus();
      return win;
    }

    function openC1() {
      const sourceSize = cachedSize("C1.mp4");
      const displaySize = fitToScreen(sourceSize);
      const c1Rect = topRightRect(displaySize, 18);

      return openVideoPopup("C1.mp4", "C1", sourceSize, {
        width: displaySize.width,
        height: displaySize.height,
        left: c1Rect.left,
        top: c1Rect.top
      }, 0, false, false);
    }

    function armOtherPopups() {
      const screenWidth = window.screen.availWidth;
      const screenHeight = window.screen.availHeight;
      const margin = 24;
      const gap = 14;
      const columns = 4;
      const rows = Math.ceil(clips.length / columns);
      const cellWidth = Math.floor((screenWidth - margin * 2 - gap * (columns - 1)) / columns);
      const cellHeight = Math.floor((screenHeight - margin * 2 - gap * (rows - 1)) / rows);
      let opened = 0;

      clips.forEach((src, index) => {
        const sourceSize = cachedSize(src);
        const column = index % columns;
        const row = Math.floor(index / columns);
        const displaySize = fitInsideCell(sourceSize, cellWidth, cellHeight);
        const cellLeft = screenWidth - margin - cellWidth - column * (cellWidth + gap);
        const cellTop = margin + row * (cellHeight + gap);
        const diagonalNudge = Math.min(gap * row, Math.max(0, cellWidth - displaySize.width));
        const left = cellLeft + Math.max(0, cellWidth - displaySize.width) - diagonalNudge;
        const top = cellTop + Math.floor((cellHeight - displaySize.height) / 2);
        const popup = openVideoPopup(src, `CAM-${String(index + 1).padStart(2, "0")}`, sourceSize, {
          width: displaySize.width,
          height: displaySize.height,
          left: Math.max(0, Math.min(left, screenWidth - displaySize.width)),
          top: Math.max(0, Math.min(top, screenHeight - displaySize.height))
        }, 5000, true, true);

        if (popup) opened += 1;
      });

      return opened;
    }

    function launchSequence() {
      if (launching) return;

      launching = true;
      launch.disabled = true;
      closeAllPopups();
      closingAll = false;
      setStatus("正在開啟 popup...");

      const armed = armOtherPopups();
      if (armed < clips.length) {
        closeAllPopups();
        setStatus(`只預先開出 ${armed}/${clips.length} 個 popup。請允許此網站彈出視窗後再按一次。`);
        launch.disabled = false;
        launching = false;
        return;
      }

      setStatus("待命 popup 已藏在右上角，正在彈出 C1...");
      const c1 = openC1();
      if (!c1) {
        closeAllPopups();
        launch.disabled = false;
        setStatus("C1 popup 被瀏覽器阻擋。請允許此網站彈出視窗後再按一次。");
        launching = false;
        return;
      }

      monitorPopups();
      setStatus("C1 已播放。其他 popup 已和按鍵綁定，5 秒後會一次炸出並循環播放。");
      window.setTimeout(() => {
        setStatus(`5 秒後已一次炸出 ${armed} 個 popup。`);
        launch.disabled = false;
        launching = false;
      }, 5000);
    }

    launch.addEventListener("click", launchSequence);

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "popup-window-closed") {
        closeAllPopups();
      }
    });

    ["C1.mp4", ...clips].forEach((src) => waitForMetadata(src));

    if (shouldAutostart) {
      launch.textContent = "LAUNCHING...";
      setStatus("已由 48.svg 啟動，正在直接播放影片...");
      window.setTimeout(launchSequence, 80);
    }
  </script>
</body>
</html>
