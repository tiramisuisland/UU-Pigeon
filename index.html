<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 飛鳥場景</title>
    <link rel="stylesheet" href="./assets/css/main.css?v=chat-room-bg-20260711">
</head>
<body>
    <div class="hud">載入模型中...<br>場景檔：<code>action.glb</code></div>
    <div class="storm-weather" aria-hidden="true"></div>
    <div class="storm-flash" aria-hidden="true"></div>
    <div class="audio-gate">
        <iframe
            class="popup-permission-frame"
            src="./爆炸0701/index.html?mode=permission"
            title="開啟爆炸彈出視窗權限"
        ></iframe>
        <iframe
            class="front-page-frame"
            data-src="./front_page/index.html"
            title="進入網站"
            allow="autoplay"
            hidden
        ></iframe>
    </div>
    <div class="readman-counters" aria-label="agree disagree 即時數字">
        <div class="readman-counter" id="agreeCounter" aria-label="agree 數字"></div>
        <div class="readman-counter" id="disagreeCounter" aria-label="disagree 數字"></div>
    </div>
    <div class="volume-slot">
        <press-volume-control id="globalVolumeControl" value="100"></press-volume-control>
    </div>
    <div class="alive-marquee" aria-live="polite">
        <div class="marquee-track" id="aliveMarqueeText">Alive : 0   You killed: 0   Global killed: Loading   Visitors : Loading   Average staying time: --   Time you stay: 00:00   Something you should know is watching does not make you neutral</div>
    </div>
    <button class="chat-toggle" id="chatToggle" type="button" aria-label="開啟聊天訊息" aria-expanded="false" aria-controls="chatPanel">
        <span class="chat-typing-dots" aria-hidden="true">
            <span class="chat-typing-dot"></span>
            <span class="chat-typing-dot"></span>
            <span class="chat-typing-dot"></span>
        </span>
    </button>
    <aside class="chat-panel" id="chatPanel" aria-label="其他人的聊天訊息" aria-hidden="true">
        <img class="chat-background-image" src="./assets/images/chat-room.svg?v=clean-20260711" alt="" aria-hidden="true">
        <div class="chat-drag-handle" aria-label="拖曳聊天室" title="拖曳聊天室"></div>
        <div class="chat-header">
            <div class="chat-title" id="chatTitle">其他人的聊天</div>
            <div class="chat-status" id="chatStatus">尚未載入</div>
        </div>
        <div class="chat-messages" id="chatMessages" role="log" aria-live="polite">
            <div class="chat-empty">打開後會載入聊天內容</div>
        </div>
        <div class="chat-action-menu" id="chatActionMenu" aria-hidden="true">
            <button class="chat-action-button" type="button" data-chat-reaction="like" aria-label="喜歡" title="喜歡">
                <img src="./assets/images/like.png" alt="">
            </button>
            <button class="chat-action-button" type="button" data-chat-reaction="dislike" aria-label="不喜歡" title="不喜歡">
                <img src="./assets/images/dislike.png" alt="">
            </button>
        </div>
    </aside>
    <img class="game-cursor" src="./assets/images/X.png" alt="" aria-hidden="true">

    <script src="./assets/js/entry-gate.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>

    <script src="./scripts/press-volume-control.js"></script>
    <script type="module" src="./assets/js/main.js?v=20260717"></script>
</body>
</html>
