<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>圖片</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <img alt="">

    <script>
        const params = new URLSearchParams(window.location.search);
        const image = document.querySelector("img");
        const imageSrc = params.get("image");
        const popupTitle = params.get("label");

        if (popupTitle) {
            document.title = popupTitle;
            image.alt = popupTitle;
        }

        function fitWindowToImage() {
            if (!image.naturalWidth || !image.naturalHeight) {
                return;
            }

            const maxWidth = Math.min(window.screen.availWidth * 0.9, 1200);
            const maxHeight = Math.min(window.screen.availHeight * 0.9, 900);
            const scale = Math.min(
                maxWidth / image.naturalWidth,
                maxHeight / image.naturalHeight
            );
            const targetInnerWidth = Math.round(image.naturalWidth * scale);
            const targetInnerHeight = Math.round(image.naturalHeight * scale);
            window.resizeBy(
                targetInnerWidth - window.innerWidth,
                targetInnerHeight - window.innerHeight
            );
        }

        image.addEventListener("load", fitWindowToImage, { once: true });

        if (imageSrc) {
            image.src = imageSrc;
        }
    </script>
</body>
</html>
