<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SM SB Popup Launcher</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="launcher-page">
    <main class="launcher" aria-label="SM SB popup launcher">
      <section class="launcher-panel">
        <p class="kicker">Popup Sequence</p>
        <h1>SM / SB</h1>
        <button class="launch-button" type="button" id="launchButton">Open Popups</button>
        <p class="launch-status" id="launchStatus" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
