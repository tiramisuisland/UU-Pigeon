server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:css|js|svg|png|jpe?g|bmp|glb|hdr|mp3|mp4|mov)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}