<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completion Result</title>
    <style>
        :root {
            --ink: #050505;
            --paper: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--paper);
            color: var(--ink);
            font-family: Futura, "Futura PT", "Trebuchet MS", Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 0;
        }

        main {
            width: min(100%, 980px);
            padding: 42px 28px;
            text-align: center;
        }

        .face {
            width: 74px;
            height: 74px;
            object-fit: contain;
            margin-bottom: 18px;
        }

        .masthead {
            display: none;
            justify-content: center;
            align-items: flex-start;
            gap: 22px;
            text-align: center;
        }

        .masthead .face {
            flex: 0 0 auto;
            width: 76px;
            height: 76px;
            margin: 9px 0 0;
            transform: rotate(-12deg);
        }

        .masthead .face.right {
            transform: rotate(12deg);
        }

        h1 {
            display: inline-block;
            margin: 0 0 18px;
            padding: 5px 16px 9px;
            border-radius: 6px;
            background: var(--ink);
            color: var(--paper);
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(44px, 9vw, 82px);
            font-style: italic;
            line-height: 0.95;
            white-space: nowrap;
        }

        .tagline {
            margin: 0 auto 12px;
            max-width: 620px;
            font-size: clamp(21px, 4vw, 34px);
            line-height: 1.2;
        }

        .copy {
            margin: 0 auto 26px;
            max-width: 600px;
            font-size: 18px;
            line-height: 1.45;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            border: 2px solid var(--ink);
            border-radius: 7px;
            padding: 9px 18px;
            color: var(--ink);
            text-decoration: none;
            font-size: 17px;
        }

        .primary {
            background: var(--ink);
            color: var(--paper);
        }

        .fail h1 {
            margin-bottom: 0;
            padding: 7px 20px 11px;
            font-size: clamp(54px, 9vw, 96px);
        }

        .fail .single-face,
        .fail > h1,
        .fail .copy,
        .fail .button-row {
            display: none;
        }

        .fail .masthead {
            display: flex;
        }

        .fail .tagline {
            max-width: none;
            margin-top: 8px;
            font-size: clamp(26px, 4vw, 42px);
            font-style: italic;
            white-space: nowrap;
        }

        .subtitle {
            margin-top: 0;
            font-size: clamp(24px, 3.5vw, 38px);
            line-height: 1.05;
        }

        @media (max-width: 760px) {
            .masthead {
                gap: 10px;
            }

            .masthead .face {
                width: 40px;
                height: 40px;
                margin-top: 6px;
            }

            .fail h1 {
                padding: 5px 12px 8px;
                font-size: clamp(34px, 10vw, 60px);
            }

            .subtitle {
                font-size: clamp(17px, 4.8vw, 28px);
            }

            .fail .tagline {
                font-size: clamp(18px, 5vw, 28px);
            }
        }
    </style>
</head>
<body>
    <main id="result">
        <img class="face single-face" src="../smile.svg" alt="">
        <header class="masthead" aria-label="You Made It? Peace of Shit Completion Check">
            <img class="face" src="../smile.svg" alt="" aria-hidden="true">
            <div>
                <h1>You Made It?</h1>
                <div class="subtitle">Peace of Shit Completion Check</div>
            </div>
            <img class="face right" src="../smile.svg" alt="" aria-hidden="true">
        </header>
        <h1 id="title"></h1>
        <p class="tagline" id="tagline"></p>
        <p class="copy" id="copy"></p>
        <div class="button-row" id="actions"></div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");
        const result = document.getElementById("result");
        const title = document.getElementById("title");
        const tagline = document.getElementById("tagline");
        const copy = document.getElementById("copy");
        const actions = document.getElementById("actions");

        function buildMailLink() {
            const recipient = "tiramisuisland@gmail.com";
            const subject = "I Made It - Peace of Shit Completion Check";
            const body = [
                "Hello Tiramisu Island,",
                "",
                "I completed the Peace of Shit Completion Check and reached the congratulations page.",
                "",
                "Please count me as one of the survivors of this strange and glorious experience.",
                "",
                "My short note:",
                "",
                "The part I remember most is:",
                "",
                "My feeling after finishing is:",
                "",
                "Best,"
            ].join("\n");

            return `mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        }

        if (status === "pass") {
            title.textContent = "Congratulations";
            tagline.textContent = "You made it. You survived the beautiful mess.";
            copy.textContent = "Certified pass. Cannon fired, chaos witnessed, dignity mostly intact. Send the news before anyone changes their mind.";
            actions.innerHTML = `
                <a class="primary" href="${buildMailLink()}">Send Email</a>
                <a href="index.html">Try Again</a>
            `;
        } else {
            result.classList.add("fail");
            title.textContent = "";
            tagline.textContent = "You’re almost there! Clear it all and get a little prize.";
            copy.textContent = "";
            actions.innerHTML = "";
        }
    </script>
</body>
</html>
