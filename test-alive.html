<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UU Pigeon｜存活鴿子測試</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #111820;
      color: #fff;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }
    .toolbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-height: 62px;
      padding: 10px 14px;
      background: rgba(13, 20, 28, 0.94);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    }
    label { font-size: 14px; font-weight: 700; }
    input, button {
      min-height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      font: inherit;
    }
    input {
      width: 92px;
      padding: 0 10px;
      background: #fff;
      color: #111;
    }
    button {
      padding: 0 14px;
      background: #f4d83f;
      color: #171717;
      font-weight: 800;
      cursor: pointer;
    }
    .preset { background: #fff; }
    iframe {
      position: fixed;
      inset: 62px 0 0;
      width: 100%;
      height: calc(100% - 62px);
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <form class="toolbar" id="test-form">
    <label for="alive-count">存活鴿子數量</label>
    <input id="alive-count" name="alive" type="number" min="0" max="100" step="1" value="13" required>
    <button type="submit">套用測試</button>
    <button class="preset" type="button" data-count="13">13</button>
    <button class="preset" type="button" data-count="28">28</button>
    <button class="preset" type="button" data-count="58">58</button>
    <button class="preset" type="button" data-count="88">88</button>
  </form>

  <iframe id="game" title="UU Pigeon 存活數量測試"></iframe>

  <script>
    const form = document.querySelector("#test-form");
    const input = document.querySelector("#alive-count");
    const game = document.querySelector("#game");

    function loadTest(count) {
      const safeCount = Math.min(100, Math.max(0, Number.parseInt(count, 10) || 0));
      input.value = safeCount;
      game.src = `./index.html?testAlive=${safeCount}`;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      loadTest(input.value);
    });

    document.querySelectorAll("[data-count]").forEach((button) => {
      button.addEventListener("click", () => loadTest(button.dataset.count));
    });

    loadTest(input.value);
  </script>
</body>
</html>
