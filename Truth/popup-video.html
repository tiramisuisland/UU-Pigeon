<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Popup Video</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="video" playsinline autoplay loop preload="auto"></video>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id") || "VIDEO";
    const src = params.get("src") || "";
    const wantsSound = params.get("sound") === "1";
    const requestedVolume = Number(params.get("volume"));
    const requestedWidth = Number(params.get("w")) || 0;
    const requestedHeight = Number(params.get("h")) || 0;
    const video = document.querySelector("#video");
    const audibleVolume = Math.max(0, Math.min(1, Number.isFinite(requestedVolume) ? requestedVolume : 1));

    document.title = id;
    video.autoplay = true;
    video.muted = wantsSound || audibleVolume === 0;
    video.volume = video.muted ? 0 : audibleVolume;
    video.src = src;

    function resizeToVideoPixels() {
      const width = requestedWidth || video.videoWidth;
      const height = requestedHeight || video.videoHeight;

      if (!width || !height) return;

      const targetInnerWidth = Math.round(width);
      const targetInnerHeight = Math.round(height);
      window.resizeBy(targetInnerWidth - window.innerWidth, targetInnerHeight - window.innerHeight);
    }

    function setMuted(nextMuted) {
      video.muted = nextMuted;
      video.volume = nextMuted ? 0 : audibleVolume;
    }

    async function startPlayback({ allowMutedFallback = true } = {}) {
      setMuted(wantsSound || audibleVolume === 0);

      try {
        await video.play();
      } catch (error) {
        if (!video.muted && allowMutedFallback) {
          setMuted(true);
          await video.play().catch(() => {
            video.setAttribute("controls", "");
          });
          return;
        }

        video.setAttribute("controls", "");
      }
    }

    async function unlockSoundAndPlay() {
      if (!wantsSound) {
        setMuted(false);
      }

      if (video.paused) {
        await video.play().catch(() => {});
      }
    }

    window.addEventListener("pointerdown", unlockSoundAndPlay);
    window.addEventListener("focus", unlockSoundAndPlay);
    window.addEventListener("pageshow", unlockSoundAndPlay);

    video.addEventListener("loadedmetadata", resizeToVideoPixels, { once: true });
    video.addEventListener("loadeddata", unlockSoundAndPlay, { once: true });
    video.addEventListener("canplay", unlockSoundAndPlay, { once: true });
    startPlayback({ allowMutedFallback: true });
  </script>
</body>
</html>
