<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lay Down the Blade</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="temple-photo" aria-label="Lay down the blade and awaken">
        <img class="statue-photo" src="./guanyin-statue.png" alt="A monumental Guanyin statue beneath the sky">
        <div class="temple-vignette" aria-hidden="true"></div>
        <div class="temple-incense temple-incense-left" aria-hidden="true"></div>
        <div class="temple-incense temple-incense-right" aria-hidden="true"></div>

        <section class="temple-message">
            <p class="temple-kicker">After the 44th pigeon falls</p>
            <h1>Lay Down<br>the Blade</h1>
            <p class="temple-subtitle">May the sound of the gun become the sound of a bell.</p>
        </section>

        <section class="temple-plaque" aria-label="Words of warning">
            <span>Turn Back</span>
            <span>Killing Is Suffering</span>
            <span>Boundless Mercy</span>
        </section>

        <button class="temple-close" type="button" onclick="window.close()">Leave in Peace</button>
    </main>
</body>
</html>
